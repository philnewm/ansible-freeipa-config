---

state: present
freeipa_config_vars_file: ""
freeipa_config_admin_principal: "admin"
freeipa_config_password: "SomeADMINpassword"
freeipa_config_defaults:
  defaultshell: /bin/bash
  homedirectory: /home
  defaultgroup: default-users
freeipa_config_users:
  - name: defatest
    first: Default
    last: Testname
    password: test_1234!
    homedir: /home/defatest
  - name: guestest
    first: Guest
    last: Testman
    password: test_1234!
    homedir: /home/guestest
freeipa_config_user_groups:
  - name: "default-users"
    description: Default user group
    posix: true
    user:
      - defatest
      - guestest
  - name: "sysadmins"
    description: Group for admins
    posix: true
    user: [defatest]
freeipa_config_sudo_rules:
  - name: sysadmin_sudo
    description: Full sudo access for sys admins
    group: [sysadmins]
    cmdcategory: all
    hostcategory: all
    runasgroupcategory: all
    runasusercategory: all

...
