---

- name: Add container fqdn to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: >-
      {{ ansible_facts.default_ipv4.address }}
      {{ inventory_hostname }}
      {{ inventory_hostname_short }}
    insertbefore: BOF
    state: present
    unsafe_writes: true

- name: Include server setup
  become: true
  ansible.builtin.import_role:
    name: freeipa.ansible_freeipa.ipaserver
  vars:
    state: present
    ipaadmin_password: "SomeADMINpassword"
    ipadm_password: "SomeADMINpassword"
    ipaserver_setup_dns: false
    ipaserver__dns_over_tls: false
    ipaserver_setup_firewalld: false
    ipaserver_setup_kra: false
    ipaclient_no_ntp: true
    ipaserver_domain: "{{ ansible_facts.domain }}"
    ipaserver_realm: "{{ ansible_facts.domain | upper }}"
    ipaserver_hostname: "{{ inventory_hostname }}"
    # Work around ansible-core evaluating delegate_to before `when`.
    # known regression https://github.com/ansible/ansible/issues/85849
    # This value is never actually used because remove_from_domain is false.
    ipaserver_remove_on_server: "{{ inventory_hostname }}"

...
